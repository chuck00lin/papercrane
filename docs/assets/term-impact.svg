<text x="499.0" y="23" text-anchor="middle" fill="#8B9BB4" font-size="13">a new run: what changes in the paper</text>
<text x="22" y="58" fill="#64748B">$</text><text x="38.9" y="58" fill="#7DD3FC" xml:space="preserve">python3 tools/impact.py --run EXP-000-example.r03</text>
<text x="22" y="78" fill="#F1F5F9" font-weight="600" xml:space="preserve"># Impact of EXP-000-example.r03  (variant: baseline)</text>
<text x="22" y="98" fill="#E2E8F0" xml:space="preserve"></text>
<text x="22" y="118" fill="#E2E8F0" xml:space="preserve">5 fact(s) in the run; 5 earlier value(s) with the same name and variant.</text>
<text x="22" y="138" fill="#E2E8F0" xml:space="preserve"></text>
<text x="22" y="158" fill="#F1F5F9" font-weight="600" xml:space="preserve">## facts-map keys pointing at the old run</text>
<text x="22" y="178" fill="#E2E8F0" xml:space="preserve">- `lane_rmse_baseline`: EXP-000-example.r01.lane_rmse_cm  -&gt;  EXP-000-example.r03.lane_rmse_cm</text>
<text x="22" y="198" fill="#E2E8F0" xml:space="preserve">- `collisions_baseline`: EXP-000-example.r01.collisions  -&gt;  EXP-000-example.r03.collisions</text>
<text x="22" y="218" fill="#E2E8F0" xml:space="preserve"></text>
<text x="22" y="238" fill="#F1F5F9" font-weight="600" xml:space="preserve">## manuscript lines using those keys</text>
<text x="22" y="258" fill="#E2E8F0" xml:space="preserve">- manuscript/sections/03-results.tex:4  [lane_rmse_baseline, collisions_baseline]  against \fact{lane_rmse_base…</text>
<text x="22" y="278" fill="#E2E8F0" xml:space="preserve"></text>
<text x="22" y="298" fill="#F1F5F9" font-weight="600" xml:space="preserve">## figures depending on these facts</text>
<text x="22" y="318" fill="#E2E8F0" xml:space="preserve">- none</text>
<text x="22" y="338" fill="#E2E8F0" xml:space="preserve"></text>
<text x="22" y="358" fill="#F1F5F9" font-weight="600" xml:space="preserve">## identity and boards citing the old ids</text>
<text x="22" y="378" fill="#E2E8F0" xml:space="preserve">- none</text>
<text x="22" y="398" fill="#E2E8F0" xml:space="preserve"></text>
<text x="22" y="418" fill="#E2E8F0" xml:space="preserve">Run with --apply to remap facts-map.yaml, then make render &amp;&amp; make check.</text>
