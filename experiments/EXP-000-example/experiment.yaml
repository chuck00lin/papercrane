# Toy design contract for the quickstart's lane-keeping pipeline (examples/toy-pipeline).
# Replace with your first real experiment.
id: EXP-000-example
title: Does the tuned lane-keeping controller track the lane centre more closely than the baseline?
status: designed
owner: researcher
question: >
  On simulated test track T1, with both controllers driven over the same seeds, how far does
  each one stray from the lane centre, and how often does it collide or fail to finish the lap?
targets:
  - claim: C1
    needs: lateral error and collision count of the tuned controller compared with the baseline on the same track and seeds
design:
  units: one simulated episode (one lap of track T1 for one seed)
  n: 12
  variables: [controller, seed]
  controls: [baseline controller on the same track and the same seeds]
  reference_protocol: >
    Lateral error is measured against the simulator's own lane-centre line, logged per
    episode by the simulator and independent of either controller's internal estimate.
  confounds_accepted: [single track geometry (T1 only; no claim about other tracks)]
  window: "seeds 1-12, one lap each"
emits:
  - name: episodes
    kind: count
    unit: null
    definition: simulated episodes (one lap of track T1 per seed) for this controller
  - name: lane_rmse_cm
    kind: metric
    unit: cm
    definition: mean over episodes of the per-episode RMSE of lateral error against the lane centre
  - name: lane_max_cm
    kind: metric
    unit: cm
    definition: largest lateral error observed in any episode
  - name: collisions
    kind: count
    unit: null
    definition: episodes that ended in a collision
  - name: completion_rate
    kind: metric
    unit: null
    definition: fraction of episodes that completed the lap
acquisition_log:
  - simulator version and track definition file used for T1
  - the seed list, and confirmation that both controllers ran the same seeds
  - controller parameter files for the baseline and the tuned variant
  - any episode dropped or re-run, and why
codespace: example-pipeline
